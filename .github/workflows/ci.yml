name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: codexbar-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "${UV_PYTHON}"

      - name: Install headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Sync project
        run: uv sync --locked --python "${UV_PYTHON}" --extra dev --extra gui

      - name: Test
        run: uv run --python "${UV_PYTHON}" pytest -ra

      - name: Ruff
        run: uv run --python "${UV_PYTHON}" ruff check src tests scripts

      - name: Strict mypy
        run: uv run --python "${UV_PYTHON}" mypy

      - name: Compile
        run: uv run --python "${UV_PYTHON}" python -m compileall -q src scripts

      - name: Architecture gates
        run: uv run --python "${UV_PYTHON}" pytest -q tests/architecture

      - name: Version authority in project and editable modes
        run: >
          uv run --python "${UV_PYTHON}" python
          scripts/validate_v17_version_modes.py --skip-tool

  version-tool-mode:
    name: uv tool version mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python
        run: uv python install "${UV_PYTHON}"

      - name: Validate uv run, editable and isolated uv tool modes
        run: >
          uv run --python "${UV_PYTHON}" python
          scripts/validate_v17_version_modes.py
