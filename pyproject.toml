[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codexbar"
version = "1.4.0"
description = "Linux Codex usage monitor designed specification-first."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [{name = "CodexBar contributors"}]
dependencies = []

[project.urls]
Repository = "https://github.com/cafvf/codexbar"

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
native-indicator = []
dev = ["pytest>=8.3", "pytest-cov>=6", "mypy>=1.15", "ruff>=0.11"]

[project.scripts]
codexbar = "codexbar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codexbar = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/codexbar"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["gi", "gi.*"]
ignore_missing_imports = true
