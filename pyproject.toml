[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codexbar"
version = "0.2.0"
description = "Linux Codex usage monitor designed specification-first."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "CodexBar contributors"}]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
native-indicator = []
dev = ["pytest>=8.3", "pytest-cov>=6", "mypy>=1.15", "ruff>=0.11"]

[project.scripts]
codexbar = "codexbar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["codexbar"]
